name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            # Load env so npm/node/pm2 are on PATH (nvm, fnm, local installs, etc.)
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"
            [ -f /etc/profile ] && . /etc/profile
            [ -f "$HOME/.profile" ] && . "$HOME/.profile"
            [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"
            NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            if command -v fnm >/dev/null 2>&1; then eval "$(fnm env)"; fi
            command -v npm >/dev/null || { echo "ERROR: npm not found on VPS after loading shell profile. Install Node or add it to PATH."; exit 127; }
            cd /var/www/YXEPristine-Property-Services
            # VPS .env is not in repo — preserve the server's secrets and avoid git merge conflicts on .env
            BACKUP_ENV=""
            if [ -f .env ]; then BACKUP_ENV="$(mktemp)" && cp .env "$BACKUP_ENV"; fi
            git fetch origin main
            git reset --hard origin/main
            if [ -n "$BACKUP_ENV" ] && [ -f "$BACKUP_ENV" ]; then
              cp "$BACKUP_ENV" .env && rm -f "$BACKUP_ENV"
            fi
            npm install 
            npm run build
            pm2 restart nextjs-app
            systemctl reload nginx
            echo "Deploy successfully"

      - name: Deployment complete
        run: |
          echo "::notice title=Deploy::Deploy successfully"
          {
            echo "## Deploy successfully"
            echo ""
            echo "Hostinger VPS deploy finished: **pm2** process \`nextjs-app\` restarted and **nginx** reloaded."
          } >> "$GITHUB_STEP_SUMMARY"