# Save as: /etc/nginx/sites-available/yxepristinepropertyservices.conf
# Enable:   sudo ln -sf /etc/nginx/sites-available/yxepristinepropertyservices.conf /etc/nginx/sites-enabled/
# Test:     sudo nginx -t && sudo systemctl reload nginx
#
# Canonical URL: https://yxepristinepropertyservices.ca (www redirects here)
# Next.js/PM2:   http://127.0.0.1:3000

server {
    listen 80;
    server_name yxepristinepropertyservices.ca www.yxepristinepropertyservices.ca;
    return 301 https://yxepristinepropertyservices.ca$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.yxepristinepropertyservices.ca;

    ssl_certificate     /etc/letsencrypt/live/yxepristinepropertyservices.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yxepristinepropertyservices.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yxepristinepropertyservices.ca$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yxepristinepropertyservices.ca;

    ssl_certificate     /etc/letsencrypt/live/yxepristinepropertyservices.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yxepristinepropertyservices.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
